name: Release

# Push a tag to release: v0.2.0 → stable, v0.3.0-beta.1 → beta (prerelease).
# The server mirrors GitHub Releases into its update feed, so installed apps update themselves.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/set-version.mjs ${{ github.ref_name }}
      - run: pnpm --filter @factory/desktop build
      - name: Package Windows installer
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win --publish never
        env:
          # Code signing (optional until the certificate is in place; unsigned builds
          # still update, but SmartScreen will warn on first install).
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest.yml

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/set-version.mjs ${{ github.ref_name }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-server"
          version="${GITHUB_REF_NAME#v}"
          tags="$image:$version"
          if [[ "$version" != *-* ]]; then tags="$tags,$image:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - id: runner-meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-runner"
          version="${GITHUB_REF_NAME#v}"
          tags="$image:$version"
          if [[ "$version" != *-* ]]; then tags="$tags,$image:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/runner.Dockerfile
          push: true
          tags: ${{ steps.runner-meta.outputs.tags }}
