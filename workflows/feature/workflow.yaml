# Feature: spec → design (with critique from other models) → plan → implement → review → docs.
type: feature
name: Feature
description: New capability. Agree what and how before building it.

steps:
  spec:
    agent: claude
    mode: consult
    prompt: prompts/spec.md
    gate: human

  design:
    agent: claude
    mode: consult
    consult: [codex]           # other providers critique the design in the same thread
    prompt: prompts/design.md
    gate: human

  plan:
    agent: codex
    mode: consult
    prompt: prompts/plan.md
    gate: auto

  implement:
    agent: claude
    mode: write
    prompt: prompts/implement.md
    gate: checks
    maxCheckAttempts: 3

  review:
    agent: codex
    mode: consult
    prompt: ../bug/prompts/review.md
    gate: human
    on:
      approved: docs
      changes_requested: implement   # continues the implement thread with the findings

  docs:
    agent: claude
    mode: write
    prompt: ../_shared/docs.md
    gate: human
    outputs: [doc_proposal]
    hooks:
      exit: [vcs.open_pr]
