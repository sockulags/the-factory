# Bug: triage → reproduce → fix → review → docs.
# One thread per step, one worktree per card. Steps advance when their gate passes;
# `on:` overrides where a decision leads.
type: bug
name: Bug
description: Something is broken. Understand it, prove it, fix it, review it.

steps:
  triage:
    agent: claude
    mode: consult          # read-only: investigate, don't change anything yet
    prompt: prompts/triage.md
    gate: human            # a person confirms scope before work starts

  reproduce:
    agent: codex
    mode: write            # adds a failing test
    prompt: prompts/reproduce.md
    gate: human

  fix:
    agent: claude
    mode: write
    prompt: prompts/fix.md
    gate: checks           # the repo's checks must pass; failures go back into this thread
    maxCheckAttempts: 3

  review:
    agent: codex           # a different provider than the one that wrote the fix
    mode: consult
    prompt: prompts/review.md
    gate: human
    on:
      approved: docs
      changes_requested: fix   # continues the fix thread with the review findings

  docs:
    agent: claude
    mode: write
    prompt: ../_shared/docs.md
    gate: human
    outputs: [doc_proposal]
    hooks:
      exit: [vcs.open_pr]      # provided by the GitHub/GitLab plugin (phase 6)
